name: Benchmark regression

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: benchmark-pages
  cancel-in-progress: false

jobs:
  benchmark-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: true
      - name: Start Go and Confluent REST proxies
        run: docker compose --profile comparison up --build -d
      - name: Smoke test Go proxy
        run: scripts/compose-smoke.sh
      - name: Run comparison benchmark
        run: make bench-pages
      - name: Run short SLO-gated soak
        run: make test-soak
      - name: Prepare sanitized benchmark page
        run: make prepare-benchmark-pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-regression
          path: |
            dist/benchmark-regression.html
            public/index.html
            coverage.out
      - name: Configure GitHub Pages
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy benchmark dashboard
        if: success() && github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop Compose stack
        if: always()
        run: docker compose down -v --remove-orphans
