name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  build-release-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: true
      - name: Resolve release metadata
        id: release
        run: |
          version="$(cat VERSION)"
          repo="$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=${repo}:${version}" >> "$GITHUB_OUTPUT"
      - name: Run release preflight
        run: |
          make fmt-check
          make openapi-check
          make licenses-check
          go test ./...
          go vet ./...
      - name: Build release binaries
        run: make build-release
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push release image
        run: |
          docker build \
            --build-arg VERSION=${{ steps.release.outputs.version }} \
            -t ${{ steps.release.outputs.image }} \
            .
          docker push ${{ steps.release.outputs.image }}
      - name: Generate release SBOMs
        env:
          IMAGE_REF: ${{ steps.release.outputs.image }}
        run: make generate-sbom
      - name: Sign release artifacts and image
        env:
          IMAGE_REF: ${{ steps.release.outputs.image }}
        run: make sign-release
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/release/
