name: kafka-rest-proxy-go-local

services:
  kafka:
    image: confluentinc/cp-kafka:${CONFLUENT_PLATFORM_VERSION:-7.7.1}
    hostname: kafka
    container_name: kafka-rest-proxy-go-kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 12
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - kafka-data:/var/lib/kafka/data

  init-topics:
    image: confluentinc/cp-kafka:${CONFLUENT_PLATFORM_VERSION:-7.7.1}
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - bash
      - -lc
      - |
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic orders --partitions 12 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic binary-events --partitions 12 --replication-factor 1

  kafka-rest-proxy-go:
    build:
      context: .
      dockerfile: Dockerfile
    image: kafka-rest-proxy-go:dev
    container_name: kafka-rest-proxy-go
    depends_on:
      init-topics:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: kafka-rest-proxy-go-local
      KAFKA_REQUIRED_ACKS: all
      KAFKA_COMPRESSION: lz4
      KAFKA_LINGER: 5ms
      KAFKA_DELIVERY_TIMEOUT: 30s
      KAFKA_REQUEST_TIMEOUT: 10s
      KAFKA_BATCH_MAX_BYTES: 1048576
      KAFKA_MAX_BUFFERED_RECORDS: 100000
      KAFKA_MAX_BUFFERED_BYTES: 134217728
      REQUEST_MAX_BYTES: 8388608
      REQUEST_MAX_RECORDS: 1000
      REQUEST_MAX_RECORD_BYTES: 1048576
      REQUEST_MAX_KEY_BYTES: 1048576
      REQUEST_MAX_HEADERS: 64
      REQUEST_MAX_HEADER_BYTES: 65536
      TOPIC_ALLOWLIST: orders,binary-events,integration-*
      PRODUCE_TIMEOUT: 30s

  prometheus:
    image: prom/prometheus:latest
    container_name: kafka-rest-proxy-go-prometheus
    depends_on:
      - kafka-rest-proxy-go
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana-oss:latest
    container_name: kafka-rest-proxy-go-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  kafka-data:
  grafana-data:
